name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install web dependencies
        run: cd web && (npm ci || npm install)

      - name: Validate workspace template structure
        run: npm run validate

      - name: Build Web App
        run: npm run web:build

      - name: Run Workspace Tests
        run: npm run test:workspace

      - name: Run Workspace API Tests
        run: npm run test:workspace-api

      - name: Run Permission Tests
        run: npm run test:permissions

      - name: Run Course Mode Tests
        run: npm run test:course-mode

      - name: Check Git Diff
        run: git diff --check
