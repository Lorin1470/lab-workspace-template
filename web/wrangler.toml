name = "lab-workspace-web"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

# 集中式 D1 資料庫綁定 (Activity Log 儲存)
# 部署至正式環境前，請先執行 npx wrangler d1 create experiment-workspace-db 填入 id
[[d1_databases]]
binding = "DB"
database_name = "experiment-workspace-db"
database_id = "8bb326e9-5a8b-4754-a10a-d7707cebacd5"

[vars]
ENVIRONMENT = "production"
# GITHUB_CLIENT_ID 與 GITHUB_CLIENT_SECRET 應透過 wrangler pages secret put 設定，絕不寫在檔案中
